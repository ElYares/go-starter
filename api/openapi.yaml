# El contrato. Fuente de verdad: se escribe a mano y primero, y de aqui salen
# los tipos de los dos lados. Ver docs/05-contratos-api.md y la Decision 010.
openapi: 3.1.0

info:
  title: go-starter API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Starter de Go + Nuxt. En la fase 0 solo existen los endpoints de salud;
    el resto llega con los modulos.

    Toda la superficie vive bajo `/api/v1`. Lo publico y sin sesion, bajo
    `/api/v1/public`.

servers:
  - url: /api/v1
    description: Mismo origen, detras del edge

# Por omision todo pide sesion. Lo publico se marca operacion por operacion con
# 'security: []', para que abrir una ruta al mundo sea un acto visible en el
# diff y no un olvido. Ver docs/04-reglas-de-crud.md seccion 5.
security:
  - cookieAuth: []

tags:
  - name: salud
    description: Estado del proceso y de sus dependencias
  - name: auth
    description: |
      Iniciar sesion y saber quien la tiene.

      **Nada de esto viaja en cabeceras.** La sesion son cookies `HttpOnly`
      sobre un solo origen: el frontend no guarda, no lee y no adjunta tokens.
      Ver la Decision 007 y `docs/05-contratos-api.md`.
  - name: settings
    description: |
      Configuracion del sitio: marca, navegacion, pie, tema.

      **No hay DELETE, y es deliberado.** El codigo de la landing lee claves por
      nombre, asi que borrar una no deja un hueco sino una pantalla rota, y sin
      rastro de que hubo algo ahi. Una clave que sobra se apaga con su valor.
  - name: content
    description: |
      Las paginas de la landing, con versiones.

      **Guardar crea una version; publicar apunta a una.** Lo que ve el publico
      es solo la version apuntada, asi que editar no toca lo publicado, y
      revertir es publicar una version anterior. Ver la Decision 006.

      Las paginas no tienen dueno: son del sitio, no de quien las creo. Quien
      tiene `content.page.write` edita cualquiera.
  - name: media
    description: |
      Las imagenes que usa el sitio: el logo, las del contenido.

      **Un archivo es su contenido.** Se identifica por el SHA-256 de sus bytes,
      asi que subir dos veces la misma imagen devuelve el registro que ya
      existia (`200`) en vez de crear otro. El tipo se deduce de los bytes, no
      del nombre ni del `Content-Type` que manda el cliente.

      Solo PNG, JPEG y WebP, hasta 5 MB. **SVG no**: es XML que puede llevar
      `<script>`, y servirlo desde el mismo origen es un XSS.

      No hay listado ni borrado todavia: borrar exige saber quien usa cada
      archivo, y eso llega con la biblioteca de medios.

paths:
  /healthz:
    get:
      tags: [salud]
      summary: El proceso vive
      description: |
        No toca la base a proposito. Mezclar las dos preguntas hace que un
        reinicio de la base parezca un proceso muerto.
      operationId: healthz
      security: []
      responses:
        "200":
          description: El proceso responde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "500":
          $ref: "#/components/responses/Problem"

  /readyz:
    get:
      tags: [salud]
      summary: El proceso puede atender
      description: Comprueba que la base responda.
      operationId: readyz
      security: []
      responses:
        "200":
          description: Listo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ok
                checks: { db: up }
        "503":
          description: Alguna dependencia no responde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable
                checks: { db: down }
                traceId: 9f2c1a7b4e0d5c68a1b3d4e5f6a7b8c9
        "500":
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesion
      description: |
        Responde `204` **sin cuerpo**: el perfil se pide con `GET /auth/me`,
        para que haya un solo lugar que defina que sabe el frontend del usuario.

        Emite cuatro cookies —`at`, `rt`, `XSRF-TOKEN` y `has_session`— cuyos
        `Path` y banderas fija la Decision 007.

        Es `security: []` por la razon obvia: quien pide una sesion todavia no
        tiene ninguna. Pero **si exige `X-XSRF-TOKEN`**, porque es una mutacion;
        la cookie la emite el primer `GET` que atraviesa el middleware.
      operationId: iniciarSesion
      security: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
      responses:
        "204":
          description: |
            Sesion iniciada. Las cookies van en `Set-Cookie`; no se declaran
            aqui como cabecera de respuesta porque son cuatro y OpenAPI no sabe
            describir `Set-Cookie` repetida.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: |
            Credenciales invalidas. **Correo inexistente, contrasena incorrecta
            y cuenta deshabilitada responden identico**: distinguirlos convierte
            el login en un oraculo de que correos estan registrados.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          description: |
            Demasiados intentos. El contador va por correo **y** por IP,
            independientes: solo por IP se saltea con NAT, y solo por correo
            deja bloquear a un tercero a voluntad.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      tags: [auth]
      summary: Quien tiene esta sesion
      description: |
        Devuelve `permissions[]` ya resueltos, no solo los roles: asi el
        frontend oculta lo que no aplica sin reimplementar el modelo de
        permisos. **Ocultar es conveniencia, no seguridad** — la autorizacion
        real vive en el servidor, en el permiso declarado de cada ruta.

        No exige ningun permiso con nombre, solo sesion: todo el mundo puede
        leer su propio perfil.
      operationId: miPerfil
      responses:
        "200":
          description: El perfil de quien hace la peticion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar la sesion
      description: |
        Cambia el `rt` de la cookie por un par nuevo —`at` y `rt`— y rota
        `XSRF-TOKEN`. Responde `204` sin cuerpo y reemite las cuatro cookies.

        El `rt` viaja en su cookie (`Path=/api/v1/auth`, HttpOnly) y **no se
        declara como parametro**: si lo fuera, una peticion sin la cookie
        responderia `400` de parametro faltante en vez del `401` que la trata
        como lo que es, una sesion que no existe.

        Es `security: []` porque justo se llama cuando el `at` ya caduco. Exige
        `X-XSRF-TOKEN`, como toda mutacion.

        **Rotacion con deteccion de robo** (CU-002): cada `rt` sirve una sola
        vez. Presentar uno que ya se roto significa que otra copia sigue
        circulando, y revoca **todas** las sesiones de esa persona. La carrera
        entre pestanas de un mismo navegador no llega aqui: la ordena el cliente
        con un candado entre pestanas.
      operationId: renovarSesion
      security: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "204":
          description: |
            Sesion renovada. Las cuatro cookies van en `Set-Cookie`, igual que
            en el login.
        "401":
          description: |
            No hay sesion que renovar: sin cookie `rt`, desconocido, caducado,
            revocado o ya usado. **Borra las cuatro cookies** —incluida
            `has_session`— para que el cliente no vuelva a intentarlo.

            Los cinco casos responden identico. Distinguir "ya usado" le diria a
            quien robo el token que lo detectaron.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar la sesion
      description: |
        Revoca el `rt` de la cookie y borra las cuatro cookies. Un `rt` revocado
        no renueva: el `at` que quede vivo caduca solo, como mucho en quince
        minutos, porque un token firmado no se puede revocar.

        **Siempre responde `204`**, haya cookie o no y exista o no el token:
        cerrar una sesion que ya no esta es cerrarla, y un error aqui dejaria al
        cliente sin saber si sigue dentro.

        Es `security: []` por la misma razon que el refresh: tiene que funcionar
        con el `at` caducado. Exige `X-XSRF-TOKEN`: sin eso, cualquier sitio
        podria cerrarle la sesion a quien lo visite.
      operationId: cerrarSesion
      security: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "204":
          description: Sesion cerrada y cookies borradas
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /public/settings:
    get:
      tags: [settings]
      summary: La configuracion publica del sitio
      description: |
        Devuelve **solo** las claves marcadas como publicas. El filtro se
        resuelve en la consulta, no en el cliente: aqui viven tambien llaves de
        terceros y correos internos.

        La consume el renderizado en servidor de la landing en cada carga.
      operationId: listarSettingsPublicas
      security: []
      responses:
        "200":
          description: Un objeto plano de clave a valor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"
              example:
                site.brand: { name: go-starter, tagline: Landing publica editable desde un dashboard }
                site.nav: [{ label: Inicio, href: "/" }]
        "500":
          $ref: "#/components/responses/Problem"

  /settings:
    get:
      tags: [settings]
      summary: Listar la configuracion, incluidas las claves privadas
      description: |
        Sigue el molde de coleccion de `docs/04-reglas-de-crud.md` seccion 3:
        envoltorio fijo `{content, page}`, nunca un array en la raiz.

        `size` tiene un **tope duro de 100**. Pedir mas no es un error: se
        devuelve el maximo, y `page.size` reporta el tamano **efectivo**.

        El orden y el filtro van por lista blanca. Un campo que no este en ella
        es `400`, no un `500` con un error de SQL.

        La consume el dashboard. La landing usa `/public/settings`, que devuelve
        un mapa plano porque necesita la configuracion entera en cada carga.
      operationId: listarSettings
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          description: |
            `campo,dir` con `dir` en `asc` (por omision) o `desc`. Se puede
            repetir para ordenar por varios criterios. Todo orden termina con un
            desempate estable por `key`: sin el, dos filas con el mismo
            `updatedAt` se repiten o se pierden entre paginas.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - key
                - key,asc
                - key,desc
                - updatedAt
                - updatedAt,asc
                - updatedAt,desc
          example: ["updatedAt,desc"]
        - name: isPublic
          in: query
          description: Filtra por visibilidad. Es el unico filtro declarado.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Una pagina de claves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

    post:
      tags: [settings]
      summary: Crear una clave de configuracion
      description: |
        La clave es la identidad del recurso: minusculas, numeros y los
        separadores `.` `_` `-` entre ellos. Repetirla es `409`.
      operationId: crearSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingNuevo"
      responses:
        "201":
          description: Creada
          headers:
            Location:
              description: URL de la clave recien creada
              schema:
                type: string
              example: /api/v1/settings/site.footer
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: La clave, por ejemplo `site.brand`.
        schema:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$"
        example: site.brand

    get:
      tags: [settings]
      summary: Leer una clave
      description: |
        Devuelve el `ETag` que hay que mandar en `If-Match` para modificarla.
      operationId: leerSetting
      responses:
        "200":
          description: La clave
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

    put:
      tags: [settings]
      summary: Reemplazar el valor de una clave
      description: |
        `If-Match` es **obligatorio** y lleva el `ETag` de la lectura. Si en la
        base hay otra version, alguien guardo en medio y la respuesta es `409`.

        Sin esto, dos personas editando la misma clave desde el dashboard
        producen que la ultima en guardar borre el trabajo de la otra, en
        silencio y sin rastro.

        La cabecera ausente sale como `400 VALIDATION_FAILED` nombrando
        `If-Match`: la tabla de codigos de la seccion 2 del molde es normativa y
        no contempla `428`.
      operationId: reemplazarSetting
      parameters:
        - name: If-Match
          in: header
          required: true
          description: El `ETag` que devolvio la lectura. `*` no se acepta.
          schema:
            type: string
          example: "\"7\""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingModificacion"
      responses:
        "200":
          description: Actualizada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /public/pages/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [content]
      summary: La version publicada de una pagina
      description: |
        Devuelve **solo** la version publicada. Una pagina que existe pero
        nunca se publico responde `404`, igual que una que no existe: el
        publico no tiene por que saber que hay un borrador.

        La consume el renderizado en servidor de la landing.
      operationId: leerPaginaPublica
      security: []
      responses:
        "200":
          description: La pagina publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaPublica"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /pages:
    get:
      tags: [content]
      summary: Listar las paginas
      description: |
        Sigue el molde de coleccion de `docs/04-reglas-de-crud.md` seccion 3.
        Cada fila es un resumen, sin bloques: el contenido se pide pagina por
        pagina.
      operationId: listarPaginas
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          description: |
            `campo,dir` con `dir` en `asc` (por omision) o `desc`. Todo orden
            termina con un desempate estable por `id`.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - slug
                - slug,asc
                - slug,desc
                - updatedAt
                - updatedAt,asc
                - updatedAt,desc
          example: ["updatedAt,desc"]
        - name: published
          in: query
          description: Filtra por si la pagina tiene una version publicada.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Una pagina de paginas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginasPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

    post:
      tags: [content]
      summary: Crear una pagina
      description: |
        Crea la pagina y su version 1, **sin publicar**. El `slug` repetido es
        `409`.

        Los bloques se validan contra el esquema de su tipo al guardar, no al
        publicar: un bloque invalido es `400` con el indice del bloque y el
        campo, por ejemplo `blocks[2].props.title`, y no se escribe nada.
      operationId: crearPagina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginaNueva"
      responses:
        "201":
          description: Creada
          headers:
            Location:
              description: URL de la pagina recien creada
              schema:
                type: string
              example: /api/v1/pages/0192a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagina"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /pages/{id}:
    parameters:
      - $ref: "#/components/parameters/PaginaId"

    get:
      tags: [content]
      summary: Leer una pagina con su ultima version
      description: |
        Devuelve el borrador —la version de numero mayor— y cual esta
        publicada. El `ETag` es el que se manda en `If-Match` para guardar.
      operationId: leerPagina
      responses:
        "200":
          description: La pagina
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagina"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

    put:
      tags: [content]
      summary: Guardar una pagina, que crea una version nueva
      description: |
        Cada guardado crea una fila nueva en las versiones y **no toca la
        publicada**. El titulo, el SEO y los bloques viajan en la version; el
        `slug` es la direccion de la pagina y no se versiona: cambiarlo cambia
        la URL publica al instante.

        `If-Match` es **obligatorio**. Si en la base hay otra version, alguien
        guardo en medio y la respuesta es `409`.
      operationId: guardarPagina
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginaModificacion"
      responses:
        "200":
          description: Guardada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagina"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

    delete:
      tags: [content]
      summary: Borrar una pagina y todas sus versiones
      description: |
        Borrado real: la pagina y sus versiones se van juntas. Si estaba
        publicada, su URL publica pasa a responder `404`.
      operationId: borrarPagina
      responses:
        "204":
          description: Borrada
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /pages/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/PaginaId"
    get:
      tags: [content]
      summary: Listar las versiones de una pagina
      description: |
        Resumenes, sin bloques, de la mas nueva a la mas vieja por omision. Es
        de donde sale el `versionId` para publicar una version anterior.
      operationId: listarVersiones
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          description: |
            `campo,dir`. Por omision `number,desc`. El numero es unico dentro
            de la pagina, asi que tambien es el desempate.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - number
                - number,asc
                - number,desc
          example: ["number,desc"]
      responses:
        "200":
          description: Una pagina de versiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionesPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /pages/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/PaginaId"
    post:
      tags: [content]
      summary: Publicar una version
      description: |
        Publicar es apuntar: la pagina publica pasa a ser esa version, de forma
        atomica. Revertir es publicar una version anterior; no se borra
        ninguna.

        No cambia el `ETag` de la pagina: publicar no toca el borrador, y quien
        lo esta editando no tiene por que recibir un `409`.

        Una version de **otra** pagina es `400` nombrando `versionId`.
      operationId: publicarPagina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Publicacion"
      responses:
        "200":
          description: Publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagina"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /media:
    post:
      tags: [media]
      summary: Subir una imagen
      description: |
        `multipart/form-data` con el archivo en el campo `file`, que va
        **primero**: un campo con otro nombre antes de el es `400`, porque
        aceptarlo en silencio haria creer que se guardo algo que no. Lo que
        venga despues de `file` no se lee.

        El archivo se lee en streaming: el SHA-256 se calcula mientras llega y
        el tope se aplica durante la lectura, no despues. Pasar de 5 MB es
        `413` y no deja nada escrito.

        Si ya existe un archivo con los mismos bytes, responde `200` con ese
        registro, aunque el nombre sea otro. Dos subidas simultaneas del mismo
        archivo terminan en un solo registro.
      operationId: subirMedio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: El archivo ya existia; es el registro de entonces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medio"
        "201":
          description: Subido
          headers:
            Location:
              description: URL del registro recien creado
              schema:
                type: string
              example: /api/v1/media/0192a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /media/{id}:
    parameters:
      - $ref: "#/components/parameters/MedioId"
    get:
      tags: [media]
      summary: Leer los datos de una imagen
      description: |
        Los metadatos, no los bytes: los bytes se sirven en
        `/public/media/{id}`, que es la direccion que se pone en un `<img>`.
      operationId: leerMedio
      responses:
        "200":
          description: El registro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /public/media/{id}:
    parameters:
      - $ref: "#/components/parameters/MedioId"
    get:
      tags: [media]
      summary: Los bytes de una imagen
      description: |
        Sin sesion: es lo que pide el navegador del visitante desde un `<img>`.
        El `Content-Type` es el que se dedujo al subir, con
        `X-Content-Type-Options: nosniff` para que el navegador no adivine otro.

        Un registro no cambia nunca, asi que la respuesta se puede guardar en
        cache para siempre (`immutable`).
      operationId: leerMedioPublico
      security: []
      responses:
        "200":
          description: Los bytes
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    cookieAuth:
      # La sesion viaja en la cookie 'at', HttpOnly, sobre un solo origen. El
      # frontend no la lee ni la adjunta: la manda el navegador. Decision 007.
      type: apiKey
      in: cookie
      name: at

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Numero de pagina, base 0.
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: |
        Tamano de pagina. El tope es **duro**: pedir mas devuelve 100 y
        `page.size` reporta el efectivo. Sin el, `?size=1000000` seria una
        negacion de servicio de una linea.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Slug:
      name: slug
      in: path
      required: true
      description: La direccion de la pagina, por ejemplo `inicio`.
      schema:
        type: string
        maxLength: 80
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      example: inicio

    PaginaId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    MedioId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: El `ETag` que devolvio la lectura. `*` no se acepta.
      schema:
        type: string
      example: "\"7\""

    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: |
        El valor de la cookie `XSRF-TOKEN`, reenviado a mano. Es el doble envio:
        quien no puede leer la cookie —otro origen— no puede forjar la cabecera.

        Se declara aqui, y no solo en el middleware, para que el cliente
        generado sepa que la operacion la necesita.
      schema:
        type: string
      example: 8f14e45fceea167a5a36dedd4bea2543

  headers:
    RetryAfter:
      description: Segundos que faltan para poder reintentar.
      schema:
        type: integer
        minimum: 1
      example: 900

    ETag:
      description: |
        La version del recurso. Es lo que se manda en `If-Match` para
        modificarlo sin pisar el cambio de otra persona.
      schema:
        type: string
      example: "\"7\""

  responses:
    Problem:
      description: Error, en la forma unica de toda la API
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
        traceId:
          type: string
          description: Presente cuando algo fallo. Es lo que se busca en el log.

    Credenciales:
      description: |
        `additionalProperties: false` a proposito: un campo de mas es un `400` y
        no algo que se ignora en silencio. Es el mismo criterio que
        `SettingNuevo`.
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          description: |
            No se normaliza a minusculas en el cliente ni en el servidor: quien
            garantiza que `Ana@casa.com` y `ana@casa.com` son la misma cuenta es
            el tipo `citext` de la columna.
          example: superadmin@go-starter.localhost
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          description: |
            El maximo no es una regla de seguridad sino de recursos: argon2
            procesa lo que le den, y un campo de diez megas ocupa un nucleo
            entero.

    Perfil:
      description: |
        Lo unico que el frontend sabe del usuario. `permissions[]` son los
        efectivos, ya resueltos por sus roles.
      type: object
      required: [id, email, displayName, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, example: superadmin@go-starter.localhost }
        displayName: { type: string, example: Superadmin de desarrollo }
        roles:
          type: array
          items: { type: string }
          example: [superadmin]
        permissions:
          description: |
            Vacio es `[]`, jamas `null`: un cliente que hace `.includes()` sobre
            null revienta, y la diferencia entre "sin permisos" y "no vino el
            campo" no le sirve a nadie.
          type: array
          items: { type: string }
          example: [identity.user.read, settings.read, settings.write]

    SettingsMap:
      description: |
        Clave a valor. El valor es JSON libre: el esquema por clave se valida en
        el servidor a partir de la fase 4, y hasta entonces darle un tipo aqui
        seria describir algo que nadie comprueba.
      type: object
      additionalProperties: true

    PageMeta:
      description: |
        Los metadatos de una pagina. `size` es el tamano EFECTIVO: si el cliente
        pidio un millon, aqui dice 100.
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, minimum: 0, example: 0 }
        size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        totalElements: { type: integer, format: int64, minimum: 0, example: 137 }
        totalPages: { type: integer, minimum: 0, example: 7 }

    Setting:
      type: object
      required: [key, value, isPublic, version, updatedAt, updatedBy]
      properties:
        key:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$"
          example: site.brand
        value:
          description: |
            JSON libre. El esquema por clave se valida en el servidor a partir
            de la fase 4, y hasta entonces darle un tipo aqui seria describir
            algo que nadie comprueba.
          example: { name: go-starter }
        isPublic:
          type: boolean
          description: |
            Que una clave sea publica es una decision explicita. Por omision es
            privada: aqui viven tambien llaves de terceros y correos internos.
          default: false
        version:
          type: integer
          minimum: 1
          description: Se devuelve tambien como `ETag`.
          example: 7
        updatedAt: { type: string, format: date-time }
        updatedBy:
          type: [string, "null"]
          format: uuid
          description: |
            Lo llena la plataforma, no el codigo de negocio. Es nulo solo en las
            filas que sembro la migracion inicial: nadie las escribio.

    SettingsPage:
      description: |
        El envoltorio de toda coleccion de esta API. Nunca un array pelado en la
        raiz: agregar metadatos despues rompe a todos los clientes a la vez. Una
        coleccion vacia sale como `[]`, jamas como `null`.
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Setting"
        page:
          $ref: "#/components/schemas/PageMeta"

    SettingNuevo:
      description: |
        El cuerpo de alta. No acepta `version` ni `updatedBy`: no son del
        cliente, y mandarlos es un `400` y no un campo ignorado en silencio.
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$"
        value: {}
        isPublic: { type: boolean, default: false }

    SettingModificacion:
      description: |
        El cuerpo de reemplazo. No trae `key`: la clave es la identidad del
        recurso y viaja en la ruta. Aceptarla aqui abriria la puerta a un `PUT`
        que renombra la fila que estaba editando otro.
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: {}
        isPublic: { type: boolean, default: false }

    Bloque:
      description: |
        Una pieza de la pagina. `type` elige el componente que la dibuja y el
        esquema que valida sus `props`; los tipos viven en el catalogo del
        modulo `content` (`api/internal/modules/content/bloques/`), que es lo
        que un fork edita para cambiar el lenguaje visual del sitio.

        `props` se declara aqui como objeto libre porque su forma depende del
        tipo: la valida el servidor al guardar, contra el esquema del catalogo.
      type: object
      required: [id, type, props]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Unico dentro de la pagina. Lo usa el editor para seguir al bloque al moverlo.
          example: b1
        type:
          type: string
          example: hero
        props:
          type: object
          additionalProperties: true
          example: { title: Hola, subtitle: Una landing editable }

    PaginaResumen:
      type: object
      required: [id, slug, title, version, draftNumber, publishedNumber, updatedAt, updatedBy]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: inicio }
        title:
          type: string
          description: El titulo del borrador, que puede no ser el publicado.
          example: Inicio
        version:
          type: integer
          minimum: 1
          description: La del `ETag`. Sube con cada guardado.
        draftNumber:
          type: integer
          minimum: 1
          description: El numero de la version mas nueva.
        publishedNumber:
          type: [integer, "null"]
          minimum: 1
          description: El numero de la version publicada; nulo si nunca se publico.
        updatedAt: { type: string, format: date-time }
        updatedBy:
          type: [string, "null"]
          format: uuid

    Pagina:
      description: |
        La pagina con su borrador, que es la version de numero mayor. Lo
        publicado se identifica por `publishedVersionId`; si coincide con
        `draftVersionId`, no hay cambios sin publicar.
      type: object
      required:
        - id
        - slug
        - version
        - title
        - seoTitle
        - seoDescription
        - blocks
        - note
        - draftVersionId
        - draftNumber
        - publishedVersionId
        - publishedNumber
        - createdAt
        - updatedAt
        - updatedBy
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: inicio }
        version:
          type: integer
          minimum: 1
          description: Se devuelve tambien como `ETag`.
        title: { type: string, example: Inicio }
        seoTitle: { type: [string, "null"] }
        seoDescription: { type: [string, "null"] }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Bloque"
        note:
          type: [string, "null"]
          description: La nota del guardado que creo el borrador.
        draftVersionId: { type: string, format: uuid }
        draftNumber: { type: integer, minimum: 1 }
        publishedVersionId:
          type: [string, "null"]
          format: uuid
          description: Nulo si la pagina nunca se publico.
        publishedNumber: { type: [integer, "null"], minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          type: [string, "null"]
          format: uuid

    PaginasPage:
      description: El envoltorio de coleccion. Ver `SettingsPage`.
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PaginaResumen"
        page:
          $ref: "#/components/schemas/PageMeta"

    PaginaNueva:
      description: |
        El cuerpo de alta. No acepta `version`, `id` ni nada de auditoria:
        mandarlos es un `400`, no un campo ignorado en silencio.
      type: object
      required: [slug, title, blocks]
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          example: nosotros
        title: { type: string, minLength: 1, maxLength: 120 }
        seoTitle: { type: [string, "null"], maxLength: 120 }
        seoDescription: { type: [string, "null"], maxLength: 300 }
        blocks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Bloque"
        note:
          type: [string, "null"]
          maxLength: 280
          description: Para que sirvio este guardado, por ejemplo "cambie el hero".

    PaginaModificacion:
      description: |
        El cuerpo de un guardado. Reemplaza el borrador completo: lo que no
        venga no se conserva de la version anterior.
      type: object
      required: [slug, title, blocks]
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        title: { type: string, minLength: 1, maxLength: 120 }
        seoTitle: { type: [string, "null"], maxLength: 120 }
        seoDescription: { type: [string, "null"], maxLength: 300 }
        blocks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Bloque"
        note: { type: [string, "null"], maxLength: 280 }

    VersionResumen:
      type: object
      required: [id, number, title, note, published, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        title: { type: string }
        note: { type: [string, "null"] }
        published:
          type: boolean
          description: Si es la version que ve el publico.
        createdAt: { type: string, format: date-time }
        createdBy:
          type: [string, "null"]
          format: uuid

    VersionesPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/VersionResumen"
        page:
          $ref: "#/components/schemas/PageMeta"

    Publicacion:
      type: object
      required: [versionId]
      additionalProperties: false
      properties:
        versionId:
          type: string
          format: uuid
          description: Una version de ESTA pagina.

    PaginaPublica:
      description: Solo lo que la landing necesita para dibujar la pagina.
      type: object
      required: [slug, title, seoTitle, seoDescription, blocks]
      properties:
        slug: { type: string, example: inicio }
        title: { type: string, example: Inicio }
        seoTitle: { type: [string, "null"] }
        seoDescription: { type: [string, "null"] }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Bloque"

    Medio:
      description: |
        Una imagen subida. No tiene `version` ni `updatedAt`: un registro no se
        modifica nunca, porque el archivo ES su contenido.
      type: object
      required:
        - id
        - url
        - mime
        - sizeBytes
        - width
        - height
        - sha256
        - originalName
        - createdAt
        - createdBy
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          description: Donde se sirven los bytes. Es lo que va en un `<img>`.
          example: /api/v1/public/media/0192a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
        mime:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sha256:
          type: string
          description: El SHA-256 de los bytes, en hexadecimal.
          pattern: "^[0-9a-f]{64}$"
        originalName:
          type: [string, "null"]
          description: |
            El nombre con el que se subio la PRIMERA vez. Una segunda subida con
            otro nombre devuelve el registro existente y no lo cambia.
        createdAt: { type: string, format: date-time }
        createdBy:
          type: [string, "null"]
          format: uuid

    Problem:
      description: |
        La forma unica de error de toda la API (RFC 7807) con dos campos
        propios: `code`, estable y en mayusculas, es lo que el cliente
        interpreta; `traceId` es lo que se busca en el log.
        Ver docs/04-reglas-de-crud.md seccion 6.
      type: object
      required: [title, status, code, traceId]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, example: VALIDATION_FAILED }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
