# Tres trabajos en paralelo. Ninguno depende de otro: si el frontend esta roto,
# igual quieres saber si el backend lo esta.
#
# Las versiones de las acciones son las ultimas al 2026-09-02, consultadas con
# 'gh api repos/<accion>/releases/latest'. Subir de a un major "por prudencia"
# nace desatrasado y trae el mismo trabajo otra vez.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Postgres de verdad, y no un doble.
    #
    # Las pruebas sin base afirman sobre lo que el service le PIDE al
    # repositorio; ninguna comprueba que la consulta que se arma sea SQL valido.
    # El molde de colecciones concatena el 'order by', el 'where' y los
    # marcadores, asi que un marcador mal numerado pasa todas aquellas y falla
    # en la primera peticion real.
    #
    # Las pruebas de integracion se saltan solas sin DATABASE_URL. Antes de este
    # servicio se saltaban SIEMPRE, que es la unica forma de tener ocho pruebas
    # verdes que nunca corrieron.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: cambiame
        ports:
          - 5432:5432
        # Sin el healthcheck, el primer paso que use la base corre contra un
        # Postgres que todavia esta arrancando, y falla una vez de cada tres.
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://starter:cambiame@localhost:5432/starter?sslmode=disable
      # Credencial de usar y tirar, de un servicio que vive lo que dura el
      # trabajo y no publica nada fuera del runner. config.Load() la exige.
      JWT_SIGNING_KEY: solo-para-ci-no-es-un-secreto

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Formato
        # gofmt no devuelve codigo de error: lista archivos. Sin este 'if', un
        # archivo mal formateado pasa el trabajo en verde.
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formatear:"; echo "$sin_formato"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Las migraciones las trae cada modulo. Correrlas aqui prueba, de paso,
      # que el runner de migraciones sigue funcionando de cero.
      - name: Migraciones
        run: go run ./cmd/migrate

      - name: Pruebas
        # -count=1 desactiva la cache de resultados: en CI queremos la ejecucion
        # real, no un "ok (cached)".
        run: go test -count=1 ./...

  web:
    name: web (nuxt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # 'test:run', nunca 'npm test' a secas: vitest se queda en watch y cuelga
      # el runner hasta el timeout.
      - name: Pruebas
        run: npm run test:run

      - name: Tipos
        run: npm run typecheck

      # No es redundante con lo anterior: el build resuelve los imports diferidos
      # de las rutas, que las pruebas no ejercitan.
      - name: Build
        run: npm run build

  contract:
    name: contract (openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint del contrato
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

      # Pendiente de HU-006: cuando existan los tipos generados, este trabajo
      # tiene que regenerarlos y fallar si el diff no esta vacio. Sin eso, un
      # spec cambiado sin regenerar pasa en verde y el frontend compila contra
      # un contrato que ya no existe.
