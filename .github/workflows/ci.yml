# Cuatro trabajos en paralelo. Ninguno depende de otro: si el frontend esta
# roto, igual quieres saber si el backend lo esta.
#
# Las versiones de las acciones son las ultimas al 2026-09-02, consultadas con
# 'gh api repos/<accion>/releases/latest'. Subir de a un major "por prudencia"
# nace desatrasado y trae el mismo trabajo otra vez.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Postgres de verdad, y no un doble.
    #
    # Las pruebas sin base afirman sobre lo que el service le PIDE al
    # repositorio; ninguna comprueba que la consulta que se arma sea SQL valido.
    # El molde de colecciones concatena el 'order by', el 'where' y los
    # marcadores, asi que un marcador mal numerado pasa todas aquellas y falla
    # en la primera peticion real.
    #
    # Las pruebas de integracion se saltan solas sin DATABASE_URL. Antes de este
    # servicio se saltaban SIEMPRE, que es la unica forma de tener ocho pruebas
    # verdes que nunca corrieron.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: cambiame
        ports:
          - 5432:5432
        # Sin el healthcheck, el primer paso que use la base corre contra un
        # Postgres que todavia esta arrancando, y falla una vez de cada tres.
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://starter:cambiame@localhost:5432/starter?sslmode=disable
      # Credencial de usar y tirar, de un servicio que vive lo que dura el
      # trabajo y no publica nada fuera del runner. config.Load() la exige.
      JWT_SIGNING_KEY: solo-para-ci-no-es-un-secreto
      # Relativa al directorio del trabajo (api/). Muere con el runner.
      STORAGE_PATH: .storage

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Formato
        # gofmt no devuelve codigo de error: lista archivos. Sin este 'if', un
        # archivo mal formateado pasa el trabajo en verde.
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formatear:"; echo "$sin_formato"; exit 1
          fi

      # El contrato es la fuente. Si el spec cambio y lo generado no, el codigo
      # compila contra un contrato que ya no existe, y eso no se nota hasta
      # produccion. Aqui se regenera y se exige que no cambie ni un byte.
      - name: Contrato al dia
        run: |
          go generate ./...
          sucio=$(git status --porcelain)
          if [ -n "$sucio" ]; then
            echo "Lo generado no coincide con api/openapi.yaml. Corre 'go generate ./...' desde api/ y commitea:"
            echo "$sucio"
            git diff
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Las migraciones las trae cada modulo. Correrlas aqui prueba, de paso,
      # que el runner de migraciones sigue funcionando de cero.
      - name: Migraciones
        run: go run ./cmd/migrate

      - name: Pruebas
        # -count=1 desactiva la cache de resultados: en CI queremos la ejecucion
        # real, no un "ok (cached)".
        run: go test -count=1 ./...

  web:
    name: web (nuxt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # La otra mitad del contrato. Misma razon que en el trabajo `api`: un spec
      # cambiado sin regenerar deja al frontend compilando contra tipos que ya
      # no describen la API.
      - name: Contrato al dia
        run: |
          npm run generate:api
          sucio=$(git status --porcelain)
          if [ -n "$sucio" ]; then
            echo "Los tipos no coinciden con api/openapi.yaml. Corre 'npm run generate:api' y commitea:"
            echo "$sucio"
            git diff
            exit 1
          fi

      # 'test:run', nunca 'npm test' a secas: vitest se queda en watch y cuelga
      # el runner hasta el timeout.
      - name: Pruebas
        run: npm run test:run

      - name: Tipos
        run: npm run typecheck

      # No es redundante con lo anterior: el build resuelve los imports diferidos
      # de las rutas, que las pruebas no ejercitan.
      - name: Build
        run: npm run build

  # Las recetas de docs/11-forks.md, recorridas en cada PR (HU-015). La promesa
  # del starter es que un modulo es una carpeta y una linea del registro: aqui
  # se agrega uno desde _template, se comprueba que compila, migra y pasa las
  # pruebas, y se quita otra vez. Si alguien hace que un modulo importe otro,
  # o el molde se pudre, falla aqui y no el dia que un fork lo necesita.
  fork:
    name: fork (recetas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: cambiame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://starter:cambiame@localhost:5432/starter?sslmode=disable
      JWT_SIGNING_KEY: solo-para-ci-no-es-un-secreto
      STORAGE_PATH: .storage

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Los scripts, sobre copias del checkout: casos de error, que no toquen de
      # mas, y que crear y quitar deje el arbol como estaba.
      - name: Renombre de un fork
        working-directory: .
        run: ./scripts/rename.test.sh
      - name: Scripts de modulos
        working-directory: .
        run: ./scripts/nuevo-modulo.test.sh

      # Y la receta de verdad, sobre este checkout.
      - name: Agregar un modulo desde _template
        working-directory: .
        run: ./scripts/nuevo-modulo.sh pedidos

      - name: Formato, build y vet con el modulo
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formatear:"; echo "$sin_formato"; exit 1
          fi
          go build ./...
          go vet ./...

      - name: Sus migraciones y sus permisos
        run: |
          go run ./cmd/migrate
          tabla=$(psql "$DATABASE_URL" -tAc "select to_regclass('pedidos_cosas')")
          permisos=$(psql "$DATABASE_URL" -tAc "select count(*) from permissions where key like 'pedidos.%'")
          echo "tabla=$tabla permisos=$permisos"
          [ "$tabla" = "pedidos_cosas" ] && [ "$permisos" = "2" ]

      - name: Pruebas con el modulo
        run: go test -count=1 ./...

      - name: Quitar el modulo
        working-directory: .
        run: |
          ./scripts/quitar-modulo.sh pedidos
          # Quitar deja el checkout como estaba: nada del modulo quedo fuera de
          # lo que el script sabe deshacer.
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build, vet y pruebas sin el modulo
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

  contract:
    name: contract (openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint del contrato
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

      # La regeneracion NO va aqui: cada lado la comprueba en su propio trabajo
      # —`api` con `go generate`, `web` con `npm run generate:api`— porque cada
      # uno ya tiene su toolchain montada. Este trabajo solo valida el contrato
      # en si, y por eso no necesita ni Go ni las dependencias del frontend.
